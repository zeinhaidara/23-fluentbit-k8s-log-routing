apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush          5
        Log_Level      info
        Parsers_File   parsers.conf
        HTTP_Server    Off

    [INPUT]
        Name             tail
        Path             /var/log/containers/*.log
        Parser           cri
        Tag              kube.*
        Skip_Long_Lines  On
        Mem_Buf_Limit    5MB

    [FILTER]
        Name               kubernetes
        Match              kube.*
        Kube_Tag_Prefix    kube.var.log.containers.
        Merge_Log          On
        Keep_Log           Off
        K8S-Logging.Parser On

    @INCLUDE routing.conf

    [OUTPUT]
        Name          es
        Match         es.kube.*
        Host          ${ES_HOST}
        Port          9200
        Index         ${ES_INDEX}
        Suppress_Type_Name On

    [OUTPUT]
        Name          s3
        Match         s3.kube.*
        bucket        ${S3_BUCKET}
        region        ${S3_REGION}
        total_file_size 50M

    [OUTPUT]
        Name          splunk
        Match         splunk.kube.*
        Host          ${SPLUNK_HOST}
        Port          8088
        Splunk_Token  ${SPLUNK_TOKEN}
        TLS           On

    [OUTPUT]
        Name          stdout
        Match         kube.*
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
  routing.conf: |
    [FILTER]
        Name          rewrite_tag
        Match         kube.*
        Rule          $kubernetes['labels']['logging.example.com/backend'] ^es$     es.$TAG     false
        Rule          $kubernetes['labels']['logging.example.com/backend'] ^s3$     s3.$TAG     false
        Rule          $kubernetes['labels']['logging.example.com/backend'] ^splunk$ splunk.$TAG false
        Emitter_Name  re_emitted
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit@sha256:4f0c43a18de9a29c3a573bfc786a2660fc0a81c40209d37926d76fc87df4f4d4
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: fluent-bit-backends
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibcontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibcontainers
          hostPath:
            path: /var/lib/docker/containers

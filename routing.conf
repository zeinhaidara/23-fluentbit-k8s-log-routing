# Routes a record by the logging.example.com/backend pod label, rewriting its tag so a
# downstream OUTPUT's Match pattern can pick it up. A record with no label, or a value none of
# these rules recognize, keeps its original "kube.*" tag and falls through to the default
# OUTPUT instead of being dropped. Shared (via @INCLUDE) by fluent-bit.conf and the test config,
# which both use the same "kube.*" tag prefix, so this is the one place the routing rules live.
[FILTER]
    Name          rewrite_tag
    Match         kube.*
    Rule          $kubernetes['labels']['logging.example.com/backend'] ^es$     es.$TAG     false
    Rule          $kubernetes['labels']['logging.example.com/backend'] ^s3$     s3.$TAG     false
    Rule          $kubernetes['labels']['logging.example.com/backend'] ^splunk$ splunk.$TAG false
    Emitter_Name  re_emitted

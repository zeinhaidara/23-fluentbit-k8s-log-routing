[SERVICE]
    Flush          5
    Log_Level      info
    Parsers_File   parsers.conf
    HTTP_Server    Off

[INPUT]
    Name             tail
    Path             /var/log/containers/*.log
    Parser           cri
    Tag              kube.*
    Skip_Long_Lines  On
    Mem_Buf_Limit    5MB

[FILTER]
    Name               kubernetes
    Match              kube.*
    Kube_Tag_Prefix    kube.var.log.containers.
    Merge_Log          On
    Keep_Log           Off
    K8S-Logging.Parser On

@INCLUDE routing.conf

# Elasticsearch - for records whose logging.example.com/backend label is "es".
[OUTPUT]
    Name          es
    Match         es.kube.*
    Host          ${ES_HOST}
    Port          9200
    Index         ${ES_INDEX}
    Suppress_Type_Name On

# S3 - for records whose logging.example.com/backend label is "s3".
[OUTPUT]
    Name          s3
    Match         s3.kube.*
    bucket        ${S3_BUCKET}
    region        ${S3_REGION}
    total_file_size 50M

# Splunk HEC - for records whose logging.example.com/backend label is "splunk".
[OUTPUT]
    Name          splunk
    Match         splunk.kube.*
    Host          ${SPLUNK_HOST}
    Port          8088
    Splunk_Token  ${SPLUNK_TOKEN}
    TLS           On

# Default - anything with no backend label, or a value none of the rules above recognize.
# Never silently dropped: this is a real, visible destination, not a null sink.
[OUTPUT]
    Name          stdout
    Match         kube.*

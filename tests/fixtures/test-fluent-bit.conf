# Test harness config: same routing.conf as production, but tailing a static fixture file
# (already shaped as if the kubernetes filter had enriched it) instead of a live cluster, and
# writing each route to its own file instead of a real es/s3/splunk backend. Read_from_Head is
# needed because tail defaults to starting at EOF (built for following live logs); without it,
# Exit_On_Eof fires immediately having read nothing.
[SERVICE]
    Flush          1
    Log_Level      info
    Parsers_File   test-parsers.conf

[INPUT]
    Name             tail
    Path             tests/fixtures/input.jsonl
    Parser           json
    Tag              kube.*
    Read_from_Head   On
    Exit_On_Eof      On

@INCLUDE ../../routing.conf

[OUTPUT]
    Name   file
    Match  es.kube.*
    Path   tests/fixtures
    File   output-es.log

[OUTPUT]
    Name   file
    Match  s3.kube.*
    Path   tests/fixtures
    File   output-s3.log

[OUTPUT]
    Name   file
    Match  splunk.kube.*
    Path   tests/fixtures
    File   output-splunk.log

[OUTPUT]
    Name   file
    Match  kube.*
    Path   tests/fixtures
    File   output-default.log
